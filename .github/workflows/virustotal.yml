name: VirusTotal Post-Release Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  virustotal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve release
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.tag || github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail

          TAG="$RELEASE_TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --json tagName --jq .tagName)"
          fi

          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid release tag format."
            exit 1
          fi

          gh release view "$TAG" >/dev/null
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'tiktok-rv-*.apk'

      - name: Upload APKs to VirusTotal
        id: scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::VT_API_KEY is not configured; skipping VirusTotal upload."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shopt -s nullglob
          APKS=(tiktok-rv-*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No tiktok-rv APK assets were found in release $TAG."
            exit 1
          fi

          NOTES_FILE="vt_links.md"
          {
            echo "### VirusTotal scan results"
            echo
            echo "_VirusTotal may need several minutes to process uploaded files._"
            echo
          } > "$NOTES_FILE"

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          for APK in "${APKS[@]}"; do
            echo "Requesting a VirusTotal upload URL for $APK..."
            UPLOAD_URL="$(curl --fail --silent --show-error --retry 3 \
              -H "x-apikey: $VT_API_KEY" \
              https://www.virustotal.com/api/v3/files/upload_url | jq -er .data)"

            if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
              echo "::error::VirusTotal did not return an upload URL."
              exit 1
            fi

            HTTP_STATUS="$(curl --silent --show-error --retry 2 \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              -F "file=@$APK" -H "x-apikey: $VT_API_KEY" "$UPLOAD_URL")"

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "::error::VirusTotal upload failed for $APK (HTTP $HTTP_STATUS)."
              exit 1
            fi

            ANALYSIS_ID="$(jq -er '.data.id' "$RESPONSE_FILE")"
            SHA256="$(sha256sum "$APK" | awk '{print $1}')"
            echo "- **$APK**: [View VirusTotal report](https://www.virustotal.com/gui/file/$SHA256) (analysis: `$ANALYSIS_ID`)" >> "$NOTES_FILE"
            echo "Upload accepted for $APK."
          done


      - name: Update release notes
        if: steps.scan.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          set -euo pipefail

          gh release view "$TAG" --json body --jq .body > current_notes.md
          awk '/^### VirusTotal scan results$/ { exit } { print }' current_notes.md > updated_notes.md
          printf '\n' >> updated_notes.md
          cat vt_links.md >> updated_notes.md
          gh release edit "$TAG" --notes-file updated_notes.md
